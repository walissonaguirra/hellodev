<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
{{ partial "head.html" . }}
<body hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:window:top">
  {{ partial "header.html" . }}

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      {{ block "main" . }}{{ end }}
    </div>
  </main>

  {{ partial "footer.html" . }}
</body>
</html>
