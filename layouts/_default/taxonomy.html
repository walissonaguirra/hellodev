{{ define "main" }}
<div class="home">
  <h1 class="page-heading">{{ .Title }}</h1>
  <ul class="post-archives">
    {{- range .Data.Terms.Alphabetical }}
    <li>
      <h2>
        <a class="post-link" href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a>
        <span class="post-meta">({{ .Count }})</span>
      </h2>
    </li>
    {{- end }}
  </ul>
</div>
{{ end }}
