{{ define "main" }}
<div class="home">
  {{- $posts := where site.RegularPages "Section" "post" -}}
  {{- $byYear := $posts.GroupByDate "2006" -}}
  {{- range $byYear }}
    <h1 id="{{ .Key }}-ref">{{ .Key }}</h1>
    <ul>
      {{- range .Pages }}
      <li>
        <h3 class="post-title-custom">
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </h3>
      </li>
      {{- end }}
    </ul>
  {{- end }}
</div>
{{ end }}
