baseURL: https://walissonaguirra.dev/
locale: pt-br
defaultContentLanguage: pt-br
title: Walisson Aguirra
removePathAccents: true

frontmatter:
  lastmod:
    - 'lastmod'
    - 'date'

params:
  description: Engenheiro de software com foco em backend e arquitetura de aplicações, Go Lang e PHP
  author: Walisson Aguirra
  ogImage: https://cdn.walissonaguirra.dev/og-walissonaguirra-1.png
  ogImageWidth: 676
  ogImageHeight: 354
  giscus:
    repo: walissonaguirra/hellodev
    repoId: R_kgDOSwHmjA
    category: Announcements
    categoryId: DIC_kwDOSwHmjM4C-hsD
    mapping: pathname
    strict: 0
    reactionsEnabled: 1
    emitMetadata: 0
    inputPosition: top
    theme: light
    lang: pt

menu:
  main:
    - name: Blog
      url: /
      weight: 1
    - name: Bio
      pageRef: /bio
      weight: 2

permalinks:
  post: /blog/:slug/

taxonomies:
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    lineNos: false
    noClasses: false
    tabWidth: 2

outputs:
  home:
    - HTML
  section:
    - HTML
  taxonomy:
    - HTML
  term:
    - HTML

security:
  http:
    urls:
      - '^https://cdn\.walissonaguirra\.dev/'
