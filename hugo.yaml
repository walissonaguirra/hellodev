baseURL: https://walissonaguirra.dev/
locale: pt-br
defaultContentLanguage: pt-br
title: Walisson Aguirra
enableRobotsTXT: true
enableEmoji: true

frontmatter:
  lastmod:
    - 'lastmod'
    - 'date'

params:
  description: Engenheiro de software com foco em backend e arquitetura de aplicações, Go Lang e PHP
  author: Walisson Aguirra
  email: walissonaguirra@proton.me
  copyright: "Walisson Aguirra"
  ogImage: https://cdn.walissonaguirra.dev/og-walissonaguirra-1.png
  ogImageWidth: 676
  ogImageHeight: 354

menu:
  main:
    - name: Blog
      url: /
      weight: 1
    - name: Bio
      pageRef: /bio
      weight: 2
    - name: RSS
      url: /index.xml
      weight: 3

permalinks:
  post: /blog/:slug/

taxonomies:
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: github
    lineNos: false
    noClasses: false
    tabWidth: 2

outputs:
  home:
    - HTML
    - RSS

security:
  http:
    urls:
      - '^https://cdn\.jsdelivr\.net/'
      - '^https://cdn\.walissonaguirra\.dev/'
