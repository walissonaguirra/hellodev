baseURL: https://walissonaguirra.dev/
locale: pt-br
defaultContentLanguage: pt-br
title: Walisson Aguirra
removePathAccents: true

frontmatter:
  lastmod:
    - 'lastmod'
    - 'date'

params:
  description: Engenheiro de software com foco em backend e arquitetura de aplicações, Go Lang e PHP
  author: Walisson Aguirra
  ogImage: https://cdn.walissonaguirra.dev/avatar-100x100.jpg
  ogImageWidth: 100
  ogImageHeight: 100

menu:
  main:
    - name: Blog
      url: /
      weight: 1
    - name: Bio
      pageRef: /bio
      weight: 2

taxonomies:
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    lineNos: false
    noClasses: false
    tabWidth: 2

outputFormats:
  clapsslugs:
    mediaType: application/json
    baseName: claps-slugs
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - clapsslugs
  section:
    - HTML
  taxonomy:
    - HTML
  term:
    - HTML

security:
  http:
    urls:
      - '^https://cdn\.walissonaguirra\.dev/'
